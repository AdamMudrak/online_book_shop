name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  APP_NAME: online-book-shop
  IMAGE_NAME: online-book-shop
  APP_PORT: "8080"
  JWT_ACTION_EXPIRATION: ${{ secrets.JWT_ACTION_EXPIRATION }}
  JWT_ACCESS_EXPIRATION: ${{ secrets.JWT_ACCESS_EXPIRATION }}
  JWT_REFRESH_EXPIRATION: ${{ secrets.JWT_REFRESH_EXPIRATION }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  MAIL: ${{ secrets.MAIL }}
  SERVER_PATH: ${{ secrets.SERVER_PATH }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        if: github.event_name == 'pull_request'
        run: mvn -B test -Dspring.profiles.active=test

      - name: Package application
        run: mvn -B package -DskipTests

      - name: Build Docker image
        if: github.event_name == 'push'
        run: docker build -t "$IMAGE_NAME:latest" .

      - name: Deploy application on Hetzner
        if: github.event_name == 'push'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_APP_DEPLOY_KEY }}
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT || '22' }}
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SPRING_LIQUIBASE_CHANGE_LOG: /db/changelog/db.changelog-master.yaml
          MAIL: legimus@adammudrak.pp.ua
          SERVER_PATH: https://legimus.adammudrak.pp.ua
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' 'hetzner-portfolio ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMrovpL5gc3TM4fs2+cVTggnYomFUO+ex9st5t1GHlB5' > ~/.ssh/known_hosts
          key="$HOME/.ssh/hetzner_deploy_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$key"
          trap 'rm -f "$key"' EXIT
          chmod 600 "$key"

          HETZNER_HOST="$(printf '%s' "$HETZNER_HOST" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          HETZNER_PORT="$(printf '%s' "$HETZNER_PORT" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          image="$APP_NAME:$GITHUB_SHA"
          docker tag "$IMAGE_NAME:latest" "$image"
          {
            python3 -c 'import json, os, sys; print(json.dumps({key: os.environ[key].strip() for key in sys.argv[1:] if os.environ.get(key, "").strip()}))' SPRING_DATASOURCE_URL SPRING_DATASOURCE_USERNAME SPRING_DATASOURCE_PASSWORD SPRING_LIQUIBASE_CHANGE_LOG JWT_ACTION_EXPIRATION JWT_ACCESS_EXPIRATION JWT_REFRESH_EXPIRATION JWT_SECRET RESEND_API_KEY MAIL SERVER_PATH
            docker save "$image"
          } | ssh -T -p "$HETZNER_PORT" -i "$key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o HostKeyAlias=hetzner-portfolio -o HostKeyAlgorithms=ssh-ed25519 \
            "root@$HETZNER_HOST" "deploy $GITHUB_SHA"
